<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="theme-color" content="#0b0b0c"><title>Produto • Trendou</title><link rel="stylesheet" href="/styles.css"><style>.product-page{padding:70px 0 90px}.product-hero{display:grid;grid-template-columns:.8fr 1.2fr;gap:46px;align-items:center}.product-hero figure{margin:0;background:#141416;border:1px solid var(--line);border-radius:24px;overflow:hidden}.product-hero figure img{width:100%;max-height:680px;object-fit:cover}.product-copy h1{font-size:clamp(42px,6vw,70px);line-height:.98;letter-spacing:-.04em;margin:15px 0}.product-copy>p{font-size:18px;color:var(--muted)}.benefit-list{display:grid;gap:10px;padding:0;list-style:none;margin:28px 0}.benefit-list li{padding:13px 15px;background:#141416;border:1px solid var(--line);border-radius:12px}.product-price{display:flex;gap:12px;align-items:baseline;margin:24px 0}.product-price del{color:#817b73}.product-price strong{font-size:42px;color:var(--gold2)}.wide{min-width:230px}@media(max-width:780px){.product-hero{grid-template-columns:1fr}.product-page{padding-top:40px}}</style></head><body><header class="topbar"><a class="logo" href="/">TREND<span>OU</span></a><nav><a href="/#produtos">Produtos</a><a href="/#ofertas">Ofertas</a></nav></header><main><section class="product-page"><div id="loading" class="status">Carregando produto…</div><div class="product-hero" id="content" hidden><figure><img id="image" alt=""></figure><div class="product-copy"><span class="eyebrow" id="category"></span><h1 id="name"></h1><p id="description"></p><ul class="benefit-list" id="benefits"></ul><div class="product-price"><del id="old-price"></del><strong id="price"></strong></div><div class="hero-actions"><a id="buy" class="button primary wide">Comprar agora</a><a href="/#produtos" class="button ghost">Voltar ao catálogo</a></div><p id="affiliate-note" style="display:none;color:var(--muted);font-size:13px">Este botão leva para uma loja parceira e pode ser um link de afiliado.</p></div></div></section></main><footer><a class="logo" href="/">TREND<span>OU</span></a><p>Compra segura e informações claras sobre cada oferta.</p><span>Trendou</span></footer><script src="/produto.js" defer></script></body></html>
